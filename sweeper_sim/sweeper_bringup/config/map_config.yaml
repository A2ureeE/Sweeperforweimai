# =============================================================
# 比赛地图接口配置文件 — map_config.yaml
#
# 用法：比赛前一天收到官方地图后：
#   1. 将官方 .world 文件放入 sweeper_gazebo/worlds/
#   2. 按地图标注填写本文件中的参数
#   3. 运行:  ./load_map.sh <world文件名>  即可自动适配
#
# 所有坐标单位：米（m），角度单位：弧度（rad）
# =============================================================

map:
  # 世界文件名（位于 sweeper_gazebo/worlds/）
  world_file: "sweep_course.world"

  # 机器人起始位置（与官方地图标注一致）
  spawn:
    x:   -10.0
    y:    -8.0
    z:     0.1
    yaw:   0.0    # 0=朝东, 1.5708=朝北, 3.1416=朝西

  # 清扫区域边界（贴边清扫 + 覆盖率计算用）
  # ★ 换地图时只需修改这四个值，算法会自动重算行间距、弧半径和墙壁余量
  area:
    x_min: -12.0
    x_max:  14.5
    y_min:  -9.0
    y_max:   9.5

  # 贴边参数（机器人与墙壁的目标距离）
  edge:
    follow_offset:  0.20   # 贴边距离（m）
    sweep_offset:   0.80   # 第一条扫行与边界的距离（m）

  # 扫行参数（Skip-Row 策略）
  sweep:
    # Skip-Row 行间距 = 2 × sweep_hw = 1.95m（= 清扫带宽，完全无缝）
    row_spacing:    1.95
    # Skip-Row U-turn 半径 = 2 × sweep_hw = 1.95m（远超车辆物理下限 0.88m）
    min_turn_radius: 1.95

  # 限宽门位置（用于门通过检测和路径规划）
  # 每个门由两个锥桶定义，机器人需从两锥之间穿过
  gates:
    - id: 1
      center: {x: 3.0, y: -8.0}   # 门中心坐标
      heading: 0.0                  # 通过方向（0=朝东）
      width:   2.0                  # 门宽（m）
    - id: 2
      center: {x: 3.0, y:  2.0}
      heading: 0.0
      width:   2.0

  # 静态锥桶障碍物位置（已知位置，供规划器预加载）
  # 如果地图未提前公布可留空 []，感知节点会自动检测
  known_obstacles: []
  # 示例：
  # known_obstacles:
  #   - {x: 2.0, y: -3.0}
  #   - {x: 4.0, y: -1.5}

  # 动态障碍物区域（行人活动范围，用于行为节点调速）
  dynamic_zone:
    center: {x: 0.0, y: 3.0}
    radius: 5.0

  # 评分参数（与评分细则对应）
  scoring:
    coverage_goal_pct:   80.0   # 覆盖率目标（%）
    edge_follow_goal_s:  30.0   # 贴边清扫时长目标（s）
    gate_pass_timeout_s: 120.0  # 单个门通过超时（s）
